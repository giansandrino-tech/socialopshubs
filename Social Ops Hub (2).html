function table(h,rows){return `<div class="card tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")||`<tr><td colspan="${h.length}" class="mu">Nothing here yet.</td></tr>`}</tbody></table></div>`}
const byWhen=(a,b)=>(a.when||"~").localeCompare(b.when||"~");

function list(){
 const ae=document.activeElement;if((tab==="models"||tab==="post"||tab==="qa")&&ae&&ae.tagName==="INPUT"&&ae.type!=="file"&&$("#list").contains(ae))return;
 let h="";const P=S.posts.slice().sort(byWhen);
 if(tab==="dash"){
  const sch=P.filter(isOpen),qa=P.filter(p=>p.status==="Posted"&&p.qa!=="Approved"),rdy=P.filter(p=>p.status==="Posted"&&p.qa==="Approved");
  const st=[["Accounts",S.models.length],["Scheduled",sch.length],["Awaiting QA",qa.length],["QA approved",rdy.length],["Posted",P.filter(p=>p.status==="Posted").length],["Overdue",sch.filter(p=>p.when&&p.when.slice(0,10)<nowL().slice(0,10)).length],["Due today",sch.filter(p=>p.when&&p.when.slice(0,10)===nowL().slice(0,10)).length],["Stored records",S.models.length+S.posts.length+S.log.length]];
  h=`<div class="grid">${st.map(([k,v])=>`<div class="card stat"><b>${v}</b><span>${k}</span></div>`).join("")}</div>${coverage()}${recent()}<h3>Next up</h3>`+
   table(["When","Model","Platform","Caption","QA"],sch.slice(0,8).map(p=>`<tr><td>${fd(p.when)}</td><td>${esc(p.modelName)}</td><td>${esc(p.platform)}</td><td>${esc((p.caption||"").slice(0,70))}</td><td>${chip(p.qa,qaC(p.qa))}</td></tr>`))}
 else if(tab==="models"){h=modelView();}else if(0){const ms=S.models.filter(m=>(!pf||m.platform===pf)&&(!q||(m.name+" "+(m.email||"")).toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name));
  h=`<div class="row" style="margin-bottom:10px"><input id="q" placeholder="Search model or email" value="${esc(q)}" style="max-width:240px"><select id="pf" style="max-width:160px"><option value="">All platforms</option>${PLATS.map(p=>`<option ${p===pf?"selected":""}>${p}</option>`).join("")}</select></div>`+
  table(["Model","Platform","Link","Email","Password",""],ms.map(m=>{const c=S.creds[m.id];return `<tr><td>${esc(m.name)}</td><td>${esc(m.platform)}</td><td>${link(m.url)}</td><td>${esc(m.email)}</td><td>${!isAdmin?'<span class="mu">Restricted</span>':c&&c.pw?`<code>${shown[m.id]?esc(c.pw):"••••••••"}</code> <button class="s" data-show="${m.id}">${shown[m.id]?"Hide":"Show"}</button> <button class="s" data-copy="${m.id}">Copy</button>`:"—"}</td><td><div class="row"><button class="s" data-edit="${m.id}">Edit</button>${delBtn("models",m.id,m.name)}</div></td></tr>`}))}
 else if(tab==="sched")h=schedList();else if(0)h=table(["When","Model","Platform","Caption","Media","Status","QA",""],P.map(p=>`<tr><td>${fd(p.when)}</td><td>${esc(p.modelName)}</td><td>${esc(p.platform)}</td><td>${esc(p.caption)}</td><td>${link(p.media)}</td><td>${chip(p.status,p.status==="Posted"?"ok":"")}</td><td>${chip(p.qa,qaC(p.qa))}</td><td>${delBtn("posts",p.id,p.modelName)}</td></tr>`));
 else if(tab==="post")h=pmf?backBar("post",pmf)+postList():tiles("post");else if(0)h=`<p class="note">Only QA-approved posts can be marked as posted.</p>`+table(["When","Model / handle","Platform","Caption","Media","Post URL / status"],P.filter(p=>p.qa==="Approved"||p.status==="Posted").map(p=>`<tr><td>${fd(p.when)}</td><td>${esc(p.modelName)}<br><span class="mu">${esc(p.handle)}</span></td><td>${esc(p.platform)}${p.type?"<br><span class=\"mu\">"+esc(p.type)+"</span>":""}</td><td>${esc(p.caption)}</td><td>${link(p.media)}</td><td>${p.status==="Posted"?`${chip("Posted "+fd(p.postedAt),"ok")} ${link(p.postedUrl)} <button class="s" data-undo="${p.id}">Reopen</button>`:`<div class="row"><input id="u${p.id}" placeholder="Live post URL" style="width:180px"><button class="p" data-post="${p.id}">Mark posted</button></div>`}</td></tr>`));
 else if(tab==="qa")h=qsel?backBar("qa",qsel)+qaList():tiles("qa");else if(tab==="qrec")h=qmf?backBar("qrec",qmf)+qrecList():tiles("qrec");else if(0)h=table(["When","Model","Caption / media","Status","Reviewer notes & decision"],P.filter(p=>p.status!=="Posted").map(p=>`<tr><td>${fd(p.when)}</td><td>${esc(p.modelName)}<br><span class="mu">${esc(p.platform)}${p.type?" · "+esc(p.type):""}</span></td><td>${esc(p.caption)}<br>${link(p.media)}</td><td>${chip(p.qa,qaC(p.qa))}</td><td><input id="n${p.id}" value="${esc(p.qaNotes)}" placeholder="Check caption, media, tags, links…"><div class="row" style="margin-top:6px"><button class="p" data-qa="${p.id}|Approved">Approve</button><button class="s d" data-qa="${p.id}|Needs fix">Needs fix</button></div></td></tr>`));
 else if(tab==="team")h=teamList();else if(tab==="store")h=`<div class="card"><p class="note">Everything entered in this system is saved in the shared database. Export a backup any time.</p><div class="row"><button class="p" data-exp="json">Export JSON backup</button><button class="s" data-exp="csv">Export posts CSV</button></div><p class="mu">${S.models.length} accounts · ${S.posts.length} posts · ${S.log.length} log entries</p></div><h3>Activity log</h3>`+(!lmf?tiles("store"):backBar("store",lmf)+logBar()+
  table(["Time","Who","Action","Model","Details"],sortedLog().map(l=>`<tr class="lgr" data-lg="${l.id}"><td>${fd(l.ts)}</td><td>${esc(l.who)||'<span class="mu">—</span>'}</td><td>${esc(l.action)}</td><td>${lmodel(l)?chip(lmodel(l)):'<span class="mu">—</span>'}</td><td>${esc(l.summary)}</td></tr>${logOpen===l.id?logDetail(l):""}`)));
 $("#list").innerHTML=h;wire()}

async function exportData(kind){
 const d=await claude.use("downloads");if(!d)return alert("Downloads unavailable here.");
 try{
  if(kind==="json")await d.save({filename:"social-ops-backup.json",data:JSON.stringify(S,null,2)});
  else{const c=["when","modelName","platform","handle","caption","media","status","qa","qaNotes","postedUrl"];
   const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
   await d.save({filename:"posting-sheet.csv",data:[c.join(","),...S.posts.slice().sort(byWhen).map(p=>c.map(k=>q(p[k])).join(","))].join("\n")})}
 }catch(e){}}

const IS='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const SUN=`<svg viewBox="0 0 24 24" width="16" height="16" ${IS}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>`,MOON=`<svg viewBox="0 0 24 24" width="16" height="16" ${IS}><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>`;
function curTheme(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function paintTheme(){const d=curTheme()==="dark";$("#th").innerHTML=(d?SUN:MOON)+(d?"Light mode":"Dark mode")}
try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}
$("#th").onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("theme",n)}catch(e){}paintTheme()};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintTheme)}catch(e){}
paintTheme();
nav();showForm();list();
(async()=>{
 db=await claude.use("db");
 if(!db){$("#msg").innerHTML=`<div class="card">Sign in to claude.ai to load and save data.</div>`;return}
 const u=await claude.use("user");isAdmin=!!(u&&await u.canEdit());try{const m=await u.me();ME={name:m.name||"",id:m.id,email:m.email||""};ISOWN=await u.isOwner();let role="Member";$(".sbfoot").innerHTML=`<img class="ua" src="${esc(m.avatarUrl)}" alt=""><span><b>${esc(ME.name||"Team member")}</b><br>${role}</span>`}catch(e){}
 if(!u||!ME.id){$("#form").innerHTML="";$("#list").innerHTML="";$("#msg").innerHTML=`<div class="card"><h2 style="margin:0 0 6px">Sign in required</h2><p class="mu" style="margin:0">Please sign in to claude.ai with the account that was given access to Social Ops Hub. If you can't open it, ask the owner to share it with you.</p></div>`;return}
 const teamReady=await new Promise(res=>{let first=true;db.collection("team").onSnapshot(s=>{T=s.docs.map(d=>d.data());if(first){first=false;res()}else{applyAccess();if(waiting&&(SUPER||MEMBER)){$("#msg").innerHTML=`<div class="card"><h2 style="margin:0">Access approved</h2><p class="mu" style="margin:6px 0 0">Please refresh this page to start.</p></div>`}else list()}},()=>{if(first){first=false;res()}})});
 applyAccess();
 if(!SUPER&&!MEMBER){waiting=true;try{await db.collection("requests").doc(ME.id).set({name:ME.name||"",ts:Date.now()})}catch(e){}$("#form").innerHTML="";$("#list").innerHTML="";$("#msg").innerHTML=`<div class="card"><h2 style="margin:0 0 6px">Waiting for approval</h2><p class="mu" style="margin:0">Your access request was sent as ${esc(ME.name||"your account")}. Please ask Gian Jaydon Sandrino to approve you, then refresh this page.</p></div>`;return}
 showForm();
 claude.use("assets").then(a=>{A=a;list();if(tab==="sched")showForm()});
 if(SUPER)db.collection("requests").onSnapshot(s=>{REQ=s.docs.map(d=>({id:d.id,...d.data()}));list()},()=>{});
 db.collection("roster").onSnapshot(s=>{ALLM=s.docs.map(d=>d.data()).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>x.name);applyAccess();if(pend&&MODELS.includes(pend)){mSel=pend;pend=null}if(!MODELS.includes(mSel))mSel=MODELS[0]||"";if(tab==="sched")showForm();list()},()=>{});
 db.collection("history").onSnapshot(s=>{S.hist=s.docs.map(d=>({id:d.id,...d.data()})).filter(h=>canSee(h.model));list()},()=>{});
 db.collection("avatars").onSnapshot(s=>{S.av={};s.docs.forEach(d=>S.av[d.id]=d.data().id);list()},()=>{});
 if(isAdmin)db.collection("credentials").onSnapshot(s=>{S.creds={};s.docs.forEach(d=>S.creds[d.id]=d.data());list()},()=>{});
 ["models","posts","log"].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>c==="log"?!!SUPER:canSee(c==="posts"?x.modelName:x.name));list()},e=>{$("#msg").innerHTML=`<div class="card">Could not load ${c}.</div>`}));
})();
